<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Places in "High Summer and the Road to Stalingrad"</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Sans+Narrow:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --land:#E2E4D2; --land-edge:#B9BCA6; --water:#B3C9D3; --river:#6E95A8; --border:#8F947D;
  --ink:#22303A; --ink-soft:#56636B; --paper:#F7F8F2; --line:#CDD1BF; --halo:#E2E4D2;
  --g-north:#4F6390; --g-kursk:#8A5A2B; --g-crimea:#2C7A76; --g-don:#9C3D2A; --g-stal:#C0261C; --g-cauc:#6A5694; --g-water:#2F6F95; --de:#2E3A44;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --serif:"PT Serif",Georgia,"Times New Roman",serif; --narrow:"PT Sans Narrow","Arial Narrow",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --land:#2B302B; --land-edge:#424A42; --water:#16222A; --river:#4F7D93; --border:#5F675C;
  --ink:#E6E7DC; --ink-soft:#A8AEA4; --paper:#1D2320; --line:#38403A; --halo:#2B302B;
  --g-north:#8EA2D4; --g-kursk:#D49A5E; --g-crimea:#5FC0B8; --g-don:#E07A61; --g-stal:#FF5A4C; --g-cauc:#AE97DE; --g-water:#6FB3DA; --de:#D8DCCF;
}}
:root[data-theme="dark"]{
  --land:#2B302B; --land-edge:#424A42; --water:#16222A; --river:#4F7D93; --border:#5F675C;
  --ink:#E6E7DC; --ink-soft:#A8AEA4; --paper:#1D2320; --line:#38403A; --halo:#2B302B;
  --g-north:#8EA2D4; --g-kursk:#D49A5E; --g-crimea:#5FC0B8; --g-don:#E07A61; --g-stal:#FF5A4C; --g-cauc:#AE97DE; --g-water:#6FB3DA; --de:#D8DCCF;
}
*{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%; margin:0; background:var(--water); color:var(--ink); font-family:var(--serif); overflow:hidden}
.app{height:100%; display:grid; grid-template-rows:auto minmax(0,1fr) auto; grid-template-columns:minmax(0,1fr)}
header{background:var(--paper); border-bottom:1px solid var(--line); padding:10px 14px 10px; display:flex; gap:12px; align-items:center; flex-wrap:wrap}
h1{min-width:0; font-size:1.05rem; line-height:1.25; margin:0; font-weight:700; flex:1 1 220px}
h1 small{display:block; font-weight:400; font-style:italic; font-size:.85rem; color:var(--ink-soft)}
.search{flex:1 1 200px; max-width:320px; position:relative}
.search input{width:100%; font:inherit; font-size:16px; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--land); color:var(--ink)}
.search input:focus-visible{outline:2px solid var(--g-stal); outline-offset:1px}
.mapwrap{position:relative; overflow:hidden; min-height:0}
svg{display:block; width:100%; height:100%; touch-action:none; cursor:grab}
svg:active{cursor:grabbing}
.land{fill:var(--land); stroke:var(--land-edge); stroke-width:.6; vector-effect:non-scaling-stroke}
.country{fill:none; stroke:var(--border); stroke-width:.8; stroke-dasharray:3 3; vector-effect:non-scaling-stroke}
.cityriver{fill:none; stroke:var(--water); stroke-linejoin:round; stroke-linecap:round}
.citybank{fill:none; stroke:var(--river); stroke-linejoin:round; stroke-linecap:round}
.lake{fill:var(--water); stroke:var(--river); stroke-width:.4; vector-effect:non-scaling-stroke}
.river{fill:none; stroke:var(--river); stroke-width:.7; opacity:.75; vector-effect:non-scaling-stroke; stroke-linecap:round}
.river.major{stroke-width:1.5; opacity:1}
.rlabel{font-family:var(--serif); font-style:italic; fill:var(--river); paint-order:stroke; stroke:var(--halo); stroke-width:3px; stroke-linejoin:round; pointer-events:none}
.region{font-family:var(--narrow); fill:var(--ink-soft); opacity:.55; letter-spacing:.18em; pointer-events:none}
.pt{cursor:pointer}
.pt circle.dot{stroke:var(--paper); }
.pt.unc circle.dot{fill:var(--paper)!important; stroke-dasharray:2 1.5}
.pt.sel circle.ring{display:block}
.pt circle.ring{display:none; fill:none; stroke:var(--ink)}
.plabel{font-family:var(--narrow); fill:var(--ink); paint-order:stroke; stroke:var(--halo); stroke-linejoin:round; pointer-events:none}
.plabel.t1{font-weight:700}
.hidden{display:none}
.controls{position:absolute; right:10px; top:10px; display:flex; flex-direction:column; gap:6px}
.controls button,.listbtn{font:inherit; font-family:var(--narrow); font-size:1rem; min-width:40px; height:40px; border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:6px; cursor:pointer}
.controls button:focus-visible,.chip:focus-visible,.listbtn:focus-visible,.item:focus-visible{outline:2px solid var(--g-stal); outline-offset:2px}
footer{background:var(--paper); border-top:1px solid var(--line); padding:8px 10px; display:flex; gap:8px; align-items:center}
.chips{min-width:0; display:flex; gap:6px; overflow-x:auto; flex:1; scrollbar-width:none; padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto; font-family:var(--narrow); font-size:.95rem; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:999px; padding:6px 11px 6px 9px; display:flex; align-items:center; gap:6px; cursor:pointer}
.chip i{width:10px; height:10px; border-radius:50%; display:inline-block}
.chip[aria-pressed="false"]{opacity:.45; text-decoration:line-through}
.listbtn{padding:0 12px; flex:0 0 auto}
.panel{position:absolute; left:0; right:0; bottom:0; max-height:52%; background:var(--paper); border-top:1px solid var(--line); box-shadow:0 -6px 24px rgba(0,0,0,.18); transform:translateY(105%); transition:transform .22s ease; display:flex; flex-direction:column; z-index:5}
.panel.open{transform:none}
@media (prefers-reduced-motion: reduce){.panel{transition:none}}
.phead{display:flex; align-items:center; justify-content:space-between; padding:10px 14px 6px; gap:10px}
.phead h2{margin:0; font-size:1.05rem}
.close{font:inherit; font-size:1.3rem; line-height:1; width:36px; height:36px; border:0; background:transparent; color:var(--ink); cursor:pointer; border-radius:6px}
.pbody{overflow-y:auto; padding:0 14px 14px; -webkit-overflow-scrolling:touch}
.detail .name{font-size:1.35rem; font-weight:700; margin:2px 0 2px}
.detail .modern{font-style:italic; color:var(--ink-soft); margin:0 0 10px}
.detail dl{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; margin:0; font-size:.95rem; line-height:1.45}
.detail dt{font-family:var(--narrow); color:var(--ink-soft)}
.detail dd{margin:0}
.list h3{font-family:var(--narrow); font-weight:700; font-size:1rem; margin:14px 0 4px; display:flex; align-items:center; gap:7px}
.list h3 i{width:10px; height:10px; border-radius:50%}
.list ul{list-style:none; margin:0; padding:0; columns:2 150px; column-gap:16px}
.item{font:inherit; font-size:.95rem; text-align:left; background:none; border:0; color:var(--ink); padding:3px 0; cursor:pointer; width:100%}
.item .q{color:var(--ink-soft); font-size:.8rem}
.note{font-size:.88rem; color:var(--ink-soft); line-height:1.5; max-width:70ch}
.legendline{display:flex; gap:14px; flex-wrap:wrap; font-family:var(--narrow); font-size:.9rem; color:var(--ink-soft); margin:6px 0 2px}
.legendline span{display:inline-flex; align-items:center; gap:6px}
.sw{width:11px;height:11px;border-radius:50%;display:inline-block;background:var(--ink-soft)}
.sw.h{background:var(--paper); border:1.5px dashed var(--ink-soft)}
.pt.dim{opacity:.16}
.ov path.arr{fill:none; stroke-width:3.2; stroke-linecap:round}
.ov path.arr.de{stroke:var(--de)} .ov path.arr.su{stroke:var(--g-stal)}
.ov path.arr.plan{stroke-dasharray:7 5}
.ov path.head.de{fill:var(--de)} .ov path.head.su{fill:var(--g-stal)}
.ov path.front{fill:none; stroke:var(--g-stal); stroke-width:4; stroke-linejoin:round; opacity:.85}
.ov text{font-family:var(--narrow); font-size:12px; fill:var(--g-stal); paint-order:stroke; stroke:var(--halo); stroke-width:3px}
.ev .date{font-style:italic; color:var(--ink-soft); margin:2px 0 0}
.ev .title{font-size:1.3rem; font-weight:700; margin:2px 0 8px; line-height:1.25}
.ev p.body{line-height:1.55; margin:0 0 12px; max-width:62ch}
.tabs{display:flex; gap:0; margin:2px 0 8px; border:1px solid var(--line); border-radius:6px; overflow:hidden}
.tabs button{flex:1; font:inherit; font-family:var(--narrow); font-size:.95rem; padding:8px 4px; line-height:1.15; border:0; background:transparent; color:var(--ink-soft); cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink); color:var(--paper)}
.tabs button:focus-visible{outline:2px solid var(--g-stal); outline-offset:-2px}
.evnav{display:flex; align-items:center; gap:8px; margin:6px 0 10px}
.evnav button{font:inherit; font-family:var(--narrow); font-size:1rem; height:38px; padding:0 14px; border:1px solid var(--line); background:var(--land); color:var(--ink); border-radius:6px; cursor:pointer}
.evnav button:disabled{opacity:.4; cursor:default}
.evnav span{font-family:var(--narrow); color:var(--ink-soft); flex:1; text-align:center}
.evkey{display:flex; gap:14px; flex-wrap:wrap; font-family:var(--narrow); font-size:.9rem; color:var(--ink-soft); margin:0 0 6px}
.evkey span{display:inline-flex; align-items:center; gap:6px}
.evkey b{display:inline-block; width:22px; height:3px; border-radius:2px}
.evlist{list-style:none; padding:0; margin:6px 0 0; border-top:1px solid var(--line)}
.evlist button{font:inherit; font-size:.92rem; text-align:left; width:100%; background:none; border:0; border-bottom:1px solid var(--line); color:var(--ink); padding:7px 0; cursor:pointer; display:flex; gap:10px}
.evlist button em{color:var(--ink-soft); flex:0 0 7.5em; font-family:var(--narrow); font-style:normal}
.evlist button[aria-current="true"]{font-weight:700}
@media (max-width:600px){ h1 small{display:none} header{padding:8px 12px} .search input{padding:6px 10px} }
@media (min-width:860px){
  .panel{left:auto; right:auto; top:0; bottom:0; width:360px; max-height:none; border-top:0; border-right:1px solid var(--line); transform:translateX(-105%); box-shadow:6px 0 24px rgba(0,0,0,.15)}
  .panel.open{transform:none}
}
</style>
</head>

function drawBase(){

  gCountries.selectAll('path').data(GEO.countries.features).join('path').attr('class','country').attr('d',path);
  // one label per major river, at the centroid of its longest piece
  const best = {};
  GEO.rivers.features.forEach(f=>{
    const n=f.properties.name; if(!MAJOR_RIVERS.has(n)) return;
    const L=d3.geoLength(f); const key=RIVER_LABEL[n]||n;
    if(!best[key]||L>best[key].L) best[key]={L,f};

  const rl = Object.entries(best).map(([n,o])=>{
    const coords = o.f.geometry.type==='LineString'?o.f.geometry.coordinates:o.f.geometry.coordinates.flat();

function zoomTo(d, k){
  const narrow = window.matchMedia('(max-width:859px)').matches;
  const cx = narrow ? W/2 : 360 + (W-360)/2, cy = narrow ? H*0.28 : H/2;
  const shifted = d3.zoomIdentity.translate(cx,cy).scale(k).translate(-d.x,-d.y);
  svg.transition().duration(matchMedia('(prefers-reduced-motion: reduce)').matches?0:650).call(zoom.transform, shifted);
}

      <dt>Placement</dt><dd>${CONF[d.c]}${d.c===1?' – best guess, check before relying on it':''}</dd>

function showList(filter=''){
  clearEvent(); panelMode='list'; selected=null; ptitle.textContent='All places';
  const f = filter.trim().toLowerCase();
  const match = p => !f || p.n.toLowerCase().includes(f) || (p.m||'').toLowerCase().includes(f) || p.k.toLowerCase().includes(f);
  let html = `<div class="list">`;
  if(!f){
    html += `<div class="legendline"><span><i class="sw"></i>Reliable or approximate</span><span><i class="sw h"></i>Uncertain placement</span><span>Dashed lines: today's borders</span></div>`;
  }
  let any=false;
  for(const g of Object.keys(GROUPS)){
    const items = pts.filter(p=>p.g===g && match(p)).sort((a,b)=>a.n.localeCompare(b.n));
    if(!items.length) continue; any=true;
    html += `<h3><i style="background:${col(g)}"></i>${GROUPS[g].name}</h3><ul>` +
      items.map(p=>`<li><button class="item" data-i="${p.i}">${esc(p.n)}${p.c===1?' <span class="q">(uncertain)</span>':''}</button></li>`).join('') + `</ul>`;
  }
  if(!any) html += `<p class="note">No place matches “${esc(filter)}”. Try the book's spelling or the modern name.</p>`;
  if(!f){
    html += `<h3>Regions</h3><p class="note">${REGIONS.map(r=>esc(r[0])+(r[3]?' ('+esc(r[3])+')':'')).join(', ')}, and the Far East (off the map).</p>`;
    html += `<h3>Mentioned but not plotted</h3><p class="note">${NOT_PLOTTED.slice(0,-1).map(r=>'<b>'+esc(r[0])+'</b>: '+esc(r[1])).join('. ')}.</p>`;
    html += `<p class="note">Positions are compiled from general knowledge rather than a gazetteer, so treat small villages as approximate. Base map: Natural Earth, with post-war reservoirs removed so the rivers look roughly as they did in 1942.</p>`;
  }
  html += `</div>`;
  pbody.innerHTML = html; openPanel(); render();
  pbody.querySelectorAll('.item').forEach(b=>b.onclick=()=>select(pts[+b.dataset.i], true));
}

function drawOverlay(){
  gOv.selectAll('*').remove();
  if(curEv<0) return;
  const ev = EVENTS[curEv];
  const P = (lon,lat)=>T.apply(proj([lon,lat]));
  if(ev.line){
    const pts2 = ev.line.map(c=>P(c[0],c[1]));
    gOv.append('path').attr('class','front').attr('d',d3.line().curve(d3.curveCatmullRom)(pts2));
    const m = pts2[pts2.length-1];
    gOv.append('text').attr('x',m[0]).attr('y',m[1]+20).attr('text-anchor','end').text(ev.lineLabel||'');
  }
  for(const a of ev.a){
    const p0=P(a[0],a[1]), p1=P(a[2],a[3]);
    const dx=p1[0]-p0[0], dy=p1[1]-p0[1], L=Math.hypot(dx,dy); if(L<6) continue;
    const nx=-dy/L, ny=dx/L, bend=L*0.12;
    const c=[(p0[0]+p1[0])/2+nx*bend,(p0[1]+p1[1])/2+ny*bend];
    const hl=Math.min(14,L*0.35);
    const tx=p1[0]-c[0], ty=p1[1]-c[1], tl=Math.hypot(tx,ty), ux=tx/tl, uy=ty/tl;
    const end=[p1[0]-ux*hl*0.6, p1[1]-uy*hl*0.6];
    gOv.append('path').attr('class','arr '+a[4]+(a[5]?' plan':'')).attr('d',`M${p0}Q${c} ${end}`);
    const b=[p1[0]-ux*hl, p1[1]-uy*hl];
    gOv.append('path').attr('class','head '+a[4]).attr('d',`M${p1}L${b[0]-uy*hl*0.5},${b[1]+ux*hl*0.5}L${b[0]+uy*hl*0.5},${b[1]-ux*hl*0.5}Z`);
  }
}
const byName = Object.fromEntries(pts.map(p=>[p.n,p]));
function fitEvent(ev){
  const xy = ev.p.map(n=>[byName[n].x,byName[n].y]);
  ev.a.forEach(a=>{xy.push(proj([a[0],a[1]]),proj([a[2],a[3]]));});
  (ev.line||[]).forEach(c=>xy.push(proj(c)));
  const xs=xy.map(p=>p[0]), ys=xy.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const narrow = matchMedia('(max-width:859px)').matches;
  const ph = narrow ? panel.getBoundingClientRect().height : 0;
  const vw = narrow? W : W-360, vh = narrow? Math.max(160, H-ph-8) : H, ox = narrow?0:360;
  const k = Math.min(160, 0.8*Math.min(vw/Math.max(x1-x0,1), vh/Math.max(y1-y0,1)));
  const tr = d3.zoomIdentity.translate(ox+vw/2, (narrow? vh/2+4 : H/2)).scale(k).translate(-(x0+x1)/2,-(y0+y1)/2);
  svg.transition().duration(matchMedia('(prefers-reduced-motion: reduce)').matches?0:700).call(zoom.transform, tr);
}

  const hasSu = ev.a.some(a=>a[4]==='su')||ev.line, hasDe = ev.a.some(a=>a[4]==='de'), hasPlan = ev.a.some(a=>a[5]);
  pbody.innerHTML = `<div class="ev">
    <div class="tabs" role="tablist">${Object.entries(SERIES).map(([k,v])=>`<button role="tab" data-s="${k}" aria-selected="${+k===ev.s}">${esc(v)}</button>`).join('')}</div>
    <div class="evnav"><button id="evprev" ${pos===0?'disabled':''}>Previous</button><span>${pos+1} of ${ser.length}</span><button id="evnext" ${pos===ser.length-1?'disabled':''}>Next</button></div>
    <p class="date">${esc(ev.d)} 1942</p><p class="title">${esc(ev.t)}</p>
    <div class="evkey">${hasDe?'<span><b style="background:var(--de)"></b>German</span>':''}${hasSu?'<span><b style="background:var(--g-stal)"></b>Soviet</span>':''}${hasPlan?'<span>Dashed: '+(ev.dashNote||(ev.s===1?'planned, from the captured papers':'planned or intended moves'))+'</span>':''}</div>
    <p class="body">${esc(ev.x)}</p>
    <ul class="evlist">${ser.map(j=>`<li><button data-j="${j}" aria-current="${j===i}"><em>${esc(EVENTS[j].d)}</em>${esc(EVENTS[j].t)}</button></li>`).join('')}</ul>
    <p class="note">Arrows show rough directions only, drawn from the book's descriptions.</p></div>`;
  pbody.scrollTop=0;
  document.getElementById('evprev').onclick=()=>showEvent(ser[pos-1]);
  document.getElementById('evnext').onclick=()=>showEvent(ser[pos+1]);
  pbody.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ const s=+b.dataset.s; if(s!==ev.s) showEvent(EVENTS.findIndex(e=>e.s===s)); });
  pbody.querySelectorAll('.evlist button').forEach(b=>b.onclick=()=>showEvent(+b.dataset.j));
  openPanel(); render(); fitEvent(ev);
}
function clearEvent(){ curEv=-1; evSet=null; }
document.getElementById('evbtn').onclick=()=> panelMode==='event'?closePanel():showEvent(curEv<0?0:curEv);

// chips
const chips=document.getElementById('chips');
for(const g of Object.keys(GROUPS)){
  const b=document.createElement('button'); b.className='chip'; b.setAttribute('aria-pressed','true');
  b.innerHTML=`<i style="background:${col(g)}"></i>${GROUPS[g].name}`;
  b.onclick=()=>{visible[g]=!visible[g]; b.setAttribute('aria-pressed',visible[g]); render();};
  chips.appendChild(b);
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{chips.querySelectorAll('i').forEach((i,n)=>i.style.background=col(Object.keys(GROUPS)[n])); render();});

window.addEventListener('resize',()=>{
  fit(); drawBase(); pts.forEach(p=>{const xy=proj([p.lo,p.la]); p.x=xy[0]; p.y=xy[1];}); render();
});
</script>
</body>
